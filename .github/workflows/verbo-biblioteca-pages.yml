name: VERBO Biblioteca e Shalom — prévias GitHub Pages

on:
  push:
    branches:
      - feature/verbo-biblioteca-preview
    paths:
      - 'apps/biblioteca/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/verbo-biblioteca-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages tem um único site por repositório: serialize os dois workflows.
concurrency:
  group: nethanel-verbo-shalom-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e compilar as duas prévias
    runs-on: ubuntu-latest
    steps:
      - name: Obter Biblioteca VERBO
        uses: actions/checkout@v4
      - name: Obter Shalom da branch de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: feature/shalom-leitor-preview
          path: _apps_source/shalom
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências da Biblioteca
        run: npm install --no-audit --no-fund
      - name: Testar Biblioteca
        run: node --test tests/*.test.mjs
      - name: Compilar Biblioteca na raiz do Pages
        run: npm run build -- --base=/verbo-app/
      - name: Instalar dependências do Shalom
        working-directory: _apps_source/shalom
        run: npm ci --no-audit --no-fund
      - name: Compilar Shalom na subpasta
        working-directory: _apps_source/shalom
        env:
          SHALOM_PAGES_BASE: /verbo-app/shalom/
          VITE_SHALOM_GITHUB_PAGES: 'true'
          VITE_SHALOM_AUTH_BASE_URL: https://dalton755.github.io/verbo-app/shalom
          VITE_SUPABASE_URL: https://uhuowymzlqstnaajcuta.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_g9frRIEMnl9_la6XwLEyQQ_vGBWJDDR'
          VITE_SHALOM_CHECKOUT_SANDBOX_ENABLED: 'true'
        run: npx vite build --config apps/shalom/vite.config.js
      - name: Preparar um único site sem apagar a outra prévia
        run: |
          mkdir -p _pages/shalom
          cp -a apps/biblioteca/dist/. _pages/
          cp -a _apps_source/shalom/apps/shalom/dist/. _pages/shalom/
          touch _pages/.nojekyll
          test -f _pages/index.html
          test -f _pages/admin.html
          test -f _pages/shalom/index.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato combinado
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    name: Publicar prévias conjuntas
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: verbo-biblioteca-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages (não usa Vercel)
        id: deployment
        uses: actions/deploy-pages@v4
