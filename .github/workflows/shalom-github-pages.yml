name: Shalom e Biblioteca VERBO — prévias GitHub Pages

on:
  push:
    branches:
      - feature/shalom-leitor-preview
    paths:
      - 'apps/shalom/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/shalom-access.test.mjs'
      - 'tests/shalom-reader-selection.test.mjs'
      - 'tests/shalom-book-cache.test.mjs'
      - '.github/workflows/shalom-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ambos os workflows geram os dois apps juntos, preservando a raiz do site.
concurrency:
  group: nethanel-verbo-shalom-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir as duas prévias no GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Shalom
        uses: actions/checkout@v4
      - name: Checkout da Biblioteca VERBO
        uses: actions/checkout@v4
        with:
          ref: feature/verbo-biblioteca-preview
          path: _apps_source/biblioteca
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Instalar dependências Shalom
        run: npm ci --no-audit --no-fund
      - name: Testar regras de vencimento do Shalom
        run: node --test tests/shalom-access.test.mjs tests/shalom-reader-selection.test.mjs tests/shalom-book-cache.test.mjs
      - name: Compilar Shalom para a subpasta
        env:
          SHALOM_PAGES_BASE: /verbo-app/shalom/
          VITE_SHALOM_GITHUB_PAGES: 'true'
          VITE_SHALOM_AUTH_BASE_URL: https://dalton755.github.io/verbo-app/shalom
          VITE_SUPABASE_URL: https://uhuowymzlqstnaajcuta.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_g9frRIEMnl9_la6XwLEyQQ_vGBWJDDR'
          VITE_SHALOM_CHECKOUT_SANDBOX_ENABLED: 'true'
        run: npx vite build --config apps/shalom/vite.config.js
      - name: Instalar dependências Biblioteca
        working-directory: _apps_source/biblioteca
        run: npm install --no-audit --no-fund
      - name: Testar Biblioteca
        working-directory: _apps_source/biblioteca
        run: node --test tests/*.test.mjs
      - name: Compilar Biblioteca para a raiz
        working-directory: _apps_source/biblioteca
        run: npm run build -- --base=/verbo-app/
      - name: Preparar diretório compartilhado de prévias
        run: |
          mkdir -p _pages/shalom
          cp -a _apps_source/biblioteca/apps/biblioteca/dist/. _pages/
          cp -a apps/shalom/dist/. _pages/shalom/
          touch _pages/.nojekyll
          test -f _pages/index.html
          test -f _pages/admin.html
          test -f _pages/shalom/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar artefato combinado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_pages

  deploy:
    name: Publicar prévias conjuntas no GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: verbo-biblioteca-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar prévias (não usa Vercel)
        id: deployment
        uses: actions/deploy-pages@v4
